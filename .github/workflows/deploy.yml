name: CD — Build & Deploy

# Runs after PRs are merged to main: the Tests workflow runs on the merge commit,
# and this workflow deploys only when that test run succeeds. Manual dispatch is
# also supported (e.g. to redeploy without a code push).
on:
  workflow_run:
    workflows: ["Tests"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: "Trading mode: paper | shadow | live"
        required: false
        default: "paper"

# ── Required repository secrets ──────────────────────────────────────────────
#  Deploy target is not hard-coded. A merge deploys to the VPS described by
#  these production environment/repository secrets:
#  VPS_HOST        — IP or hostname of your Ubuntu VPS
#  VPS_USER        — SSH login user (e.g. ubuntu, root, yukti)
#  VPS_SSH_KEY     — PEM-encoded SSH private key (matching an authorised_key on VPS)
#  VPS_DEPLOY_DIR  — Absolute path on the VPS where docker-compose.yml lives
#                    (e.g. /home/ubuntu/yukti)
#  GHCR_TOKEN      — GitHub PAT with "read:packages" scope  (used by VPS to pull)
#                    Create at: Settings → Developer settings → Personal access tokens
#  POSTGRES_PASSWORD — passed to docker compose on the VPS
#  GRAFANA_PASSWORD  — (optional) Grafana admin password
# ─────────────────────────────────────────────────────────────────────────────

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Guard: skip if triggered by a failed test run ─────────────────────────
  guard:
    name: Check upstream status
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Upstream Tests workflow did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }}). Skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Build Docker image and push to GHCR ───────────────────────────────────
  build:
    name: Build & push image
    needs: guard
    if: needs.guard.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # needed to push to ghcr.io

    outputs:
      image_tag: ${{ steps.image_tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set immutable image tag
        id: image_tag
        run: echo "value=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yukti
          tags: |
            type=sha,prefix=main-,format=short
            type=raw,value=latest,enable=true

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── SSH deploy to VPS ─────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [guard, build]
    if: needs.guard.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment: production     # add manual approval here in repo Settings → Environments

    steps:
      - name: Validate deployment target secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_DEPLOY_DIR: ${{ secrets.VPS_DEPLOY_DIR }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_DEPLOY_DIR GHCR_TOKEN POSTGRES_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required deploy secret $name is not set. This merge cannot deploy until production target secrets are configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Deploy target secrets are configured. The exact host and path come from VPS_HOST and VPS_DEPLOY_DIR."

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          DEPLOY_MODE: ${{ github.event.inputs.mode || 'paper' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,IMAGE_TAG,DEPLOY_MODE,POSTGRES_PASSWORD,GRAFANA_PASSWORD
          script: |
            set -euo pipefail

            DEPLOY_DIR="${{ secrets.VPS_DEPLOY_DIR }}"
            IMAGE="ghcr.io/${{ github.repository_owner }}/yukti:${IMAGE_TAG}"

            echo "[deploy] logging in to GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            echo "[deploy] pulling image ${IMAGE}..."
            docker pull "$IMAGE"

            echo "[deploy] preparing deploy directory $DEPLOY_DIR..."
            cd "$DEPLOY_DIR"
            if [ -d .git ]; then
              git fetch --prune origin main
              git reset --hard origin/main
            fi

            # Export env vars for docker compose interpolation
            export POSTGRES_PASSWORD="$POSTGRES_PASSWORD"
            export GRAFANA_PASSWORD="${GRAFANA_PASSWORD:-admin}"
            export MODE="$DEPLOY_MODE"
            export YUKTI_IMAGE="$IMAGE"

            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.deploy.yml"

            # Rolling restart: only restart the yukti container; leave DB/Redis up
            $COMPOSE pull yukti
            $COMPOSE up -d --no-deps --force-recreate yukti

            echo "[deploy] cleaning up old images..."
            docker image prune -f

            echo "[deploy] done. Container status:"
            $COMPOSE ps yukti

      - name: Notify success
        if: success()
        run: |
          echo "Deployed yukti (mode=${{ github.event.inputs.mode || 'paper' }}, sha=${{ github.sha }}) successfully."

      - name: Notify failure
        if: failure()
        run: |
          echo "::error::Deploy failed for sha=${{ github.sha }}. Check SSH logs above."
